; ESP32-S3 BLE HID Macro Keyboard
; Build: pio run -e esp32-s3-devkitc-1
; Flash firmware + web UI: pio run -e esp32-s3-devkitc-1 -t upload
;   (the UI is built in; saved recordings and patterns are never touched)
; Reset the filesystem to data/: pio run -e esp32-s3-devkitc-1 -t uploadfs
;   (backs up the saved config first; see tools/pio_keep_config.py)
; Back up the saved config: pio run -e esp32-s3-devkitc-1 -t backup

[platformio]
default_envs = esp32-s3-devkitc-1
data_dir = data

[env:esp32-s3-devkitc-1]
platform = espressif32@^6.9.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
extra_scripts =
    pre:tools/embed_web_ui.py
    pre:tools/embed_update_key.py
    pre:tools/pio_keep_config.py

; USB CDC on boot so Serial works over the native USB port
build_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D CORE_DEBUG_LEVEL=2

lib_deps =
    h2zero/NimBLE-Arduino@^1.4.2
    bblanchon/ArduinoJson@^7.2.0
    esp32async/ESPAsyncWebServer@^3.6.0
    esp32async/AsyncTCP@^3.3.2
