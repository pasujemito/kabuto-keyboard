; ESP32-S3 BLE HID Macro Keyboard
; Build: pio run -e esp32-s3-devkitc-1
; Flash: pio run -e esp32-s3-devkitc-1 -t upload
; Upload web UI assets: pio run -e esp32-s3-devkitc-1 -t uploadfs
;   (keeps the config saved on the pad; see tools/pio_keep_config.py)
; Back up the saved config: pio run -e esp32-s3-devkitc-1 -t backup

[platformio]
default_envs = esp32-s3-devkitc-1
data_dir = data

[env:esp32-s3-devkitc-1]
platform = espressif32@^6.9.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
extra_scripts = pre:tools/pio_keep_config.py

; USB CDC on boot so Serial works over the native USB port
build_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D CORE_DEBUG_LEVEL=2

lib_deps =
    h2zero/NimBLE-Arduino@^1.4.2
    bblanchon/ArduinoJson@^7.2.0
    esp32async/ESPAsyncWebServer@^3.6.0
    esp32async/AsyncTCP@^3.3.2
